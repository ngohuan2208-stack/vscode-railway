[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.environment]
NODE_ENV = "production"
LOG_LEVEL = "info"
WORKSPACE_DIR = "/workspace"
