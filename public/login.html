<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Railway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e1e;
      --surface: #252526;
      --border: #3c3c3c;
      --text: #cccccc;
      --text-muted: #808080;
      --accent: #007acc;
      --accent-hover: #0098ff;
      --error: #f44336;
      --error-bg: rgba(244, 67, 54, 0.1);
      --success: #4caf50;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: var(--accent);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .logo p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .btn-login {
      width: 100%;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: var(--accent-hover);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      padding: 10px 12px;
      background: var(--error-bg);
      border: 1px solid var(--error);
      border-radius: 4px;
      color: var(--error);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .error-message.visible {
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M95.5 44.5L56.2 5.2c-2.8-2.8-7.4-2.8-10.2 0L5.2 46.1c-2.8 2.8-2.8 7.4 0 10.2l40.9 40.9c1.4 1.4 3.3 2.1 5.1 2.1s3.7-.7 5.1-2.1l39.2-39.2c2.8-2.8 2.8-7.4 0-10.2zM50 83.3L12.5 45.8 50 8.3l37.5 37.5L50 83.3zM56.2 51.8L87.6 20.4l-6.4-6.4L50 45.2 18.8 14l-6.4 6.4 31.4 31.4-26 26c-1.4 1.4-1.4 3.7 0 5.1l5.1 5.1c.7.7 1.7 1.1 2.6 1.1s1.8-.4 2.6-1.1l26-26z"/>
        </svg>
      </div>
      <h1>VS Code Railway</h1>
      <p>Web IDE - Enter password to continue</p>
    </div>

    <div id="error-box" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          autofocus
        >
      </div>
      <button type="submit" class="btn-login" id="login-btn">Login</button>
    </form>

    <div class="footer">
      Powered by code-server + Railway
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const errorBox = document.getElementById('error-box');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const password = passwordInput.value.trim();
      if (!password) {
        showError('Please enter a password');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          // Clear password from input immediately
          passwordInput.value = '';
          // Redirect to IDE
          window.location.href = '/';
        } else if (res.status === 429) {
          showError('Too many failed attempts. Please wait 15 minutes.');
          loginBtn.disabled = true;
          loginBtn.textContent = 'Locked';
        } else if (res.status === 401) {
          showError('Invalid password');
          passwordInput.value = '';
          passwordInput.focus();
        } else {
          showError(data.error || 'Server error. Please try again.');
        }
      } catch (err) {
        showError('Server unavailable. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
