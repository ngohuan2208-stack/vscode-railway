<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VS Code Railway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --border: #3c3c3c;
      --text: #cccccc; --text-muted: #808080; --accent: #007acc; --accent-hover: #0098ff;
      --error: #f44336; --error-bg: rgba(244,67,54,0.1);
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; -webkit-tap-highlight-color: transparent;
    }
    .login-container {
      width: 100%; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 40px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; background: var(--accent); border-radius: 14px; margin-bottom: 16px;
    }
    .logo-icon svg { width: 36px; height: 36px; fill: white; }
    .logo h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .logo p { font-size: 13px; color: var(--text-muted); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 16px; outline: none; transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--text-muted); }
    .btn-login {
      width: 100%; padding: 12px 16px; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-message {
      display: none; padding: 10px 14px; background: var(--error-bg); border: 1px solid var(--error);
      border-radius: 6px; color: var(--error); font-size: 13px; margin-bottom: 16px;
    }
    .error-message.visible { display: block; }
    .footer { text-align: center; margin-top: 24px; font-size: 12px; }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer span { color: var(--text-muted); margin: 0 8px; }
    @media (max-width: 480px) {
      .login-container { padding: 32px 20px; border-radius: 8px; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100"><path d="M95.5 44.5L56.2 5.2c-2.8-2.8-7.4-2.8-10.2 0L5.2 46.1c-2.8 2.8-2.8 7.4 0 10.2l40.9 40.9c1.4 1.4 3.3 2.1 5.1 2.1s3.7-.7 5.1-2.1l39.2-39.2c2.8-2.8 2.8-7.4 0-10.2zM50 83.3L12.5 45.8 50 8.3l37.5 37.5L50 83.3zM56.2 51.8L87.6 20.4l-6.4-6.4L50 45.2 18.8 14l-6.4 6.4 31.4 31.4-26 26c-1.4 1.4-1.4 3.7 0 5.1l5.1 5.1c.7.7 1.7 1.1 2.6 1.1s1.8-.4 2.6-1.1l26-26z"/></svg>
      </div>
      <h1>VS Code Railway</h1>
      <p>Enter password to continue</p>
    </div>
    <div id="error-box" class="error-message"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn-login" id="login-btn">Login</button>
    </form>
    <div class="footer">
      <a href="/settings">Settings</a><span>|</span><span>code-server + Railway</span>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const pw = document.getElementById('password');
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-box');
    function showErr(m) { err.textContent = m; err.classList.add('visible'); }
    function hideErr() { err.classList.remove('visible'); }
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); hideErr();
      const p = pw.value.trim();
      if (!p) { showErr('Please enter a password'); return; }
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p }) });
        const d = await res.json();
        if (res.ok && d.ok) { pw.value = ''; window.location.href = d.redirect || '/'; }
        else if (res.status === 429) { showErr('Too many attempts. Wait 15 min.'); btn.disabled = true; btn.textContent = 'Locked'; }
        else if (res.status === 401) { showErr('Invalid password'); pw.value = ''; pw.focus(); }
        else showErr(d.error || 'Server error');
      } catch { showErr('Server unavailable'); }
      finally { btn.disabled = false; btn.textContent = 'Login'; }
    });
  </script>
</body>
</html>
