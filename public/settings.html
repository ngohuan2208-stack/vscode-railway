<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings - VS Code Railway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface2: #2d2d2d; --border: #3c3c3c;
      --text: #cccccc; --text-muted: #808080; --accent: #007acc; --accent-hover: #0098ff;
      --green: #4caf50; --red: #f44336; --yellow: #ff9800;
    }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 100; }
    .navbar-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .navbar h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .navbar-links { display: flex; gap: 4px; }
    .navbar-links a { color: var(--text-muted); text-decoration: none; font-size: 12px; padding: 6px 10px; border-radius: 4px; transition: all 0.2s; }
    .navbar-links a:hover, .navbar-links a.active { color: #fff; background: var(--accent); }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 12px; }
    .card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; outline: none; -webkit-appearance: none; }
    .form-group input:focus { border-color: var(--accent); }
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .hint a { color: var(--accent); }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 8px; border-radius: 4px; }
    .status-ok { background: rgba(76,175,80,0.15); color: var(--green); }
    .status-err { background: rgba(244,67,54,0.15); color: var(--red); }
    .repo-list { max-height: 360px; overflow-y: auto; }
    .repo-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; gap: 10px; }
    .repo-item:hover { border-color: var(--accent); }
    .repo-info { flex: 1; min-width: 0; }
    .repo-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repo-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repo-meta { display: flex; gap: 10px; margin-top: 3px; font-size: 10px; color: var(--text-muted); }
    .repo-badge { font-size: 10px; padding: 2px 5px; border-radius: 3px; background: rgba(255,152,0,0.15); color: var(--yellow); }
    .repo-actions { flex-shrink: 0; }
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 6px; overflow-x: auto; }
    .tab { padding: 7px 14px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; color: var(--text-muted); border: none; background: none; white-space: nowrap; flex-shrink: 0; }
    .tab.active { color: #fff; background: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); background: var(--surface2); }
    .project-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; gap: 10px; }
    .project-name { font-size: 13px; font-weight: 500; color: #fff; }
    .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; padding: 20px; justify-content: center; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px; }
    .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 10000; animation: slideIn 0.3s ease; }
    .toast-success { background: var(--green); color: #fff; }
    .toast-error { background: var(--red); color: #fff; }
    @keyframes slideIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 600px) {
      .container { padding: 16px 12px; }
      .card { padding: 16px; }
      .repo-item { flex-direction: column; align-items: flex-start; }
      .repo-actions { width: 100%; }
      .repo-actions .btn { width: 100%; justify-content: center; }
      .btn-row { flex-direction: column; }
      .btn-row .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <h1>VS Code Railway</h1>
      <div class="navbar-links">
        <a href="/settings" class="active">Settings</a>
        <a href="/">IDE</a>
        <a href="/logout">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="card">
      <h2>GitHub Integration</h2>
      <p class="card-desc">Configure your Personal Access Token to browse and clone repositories.</p>
      <div class="form-group">
        <label>Personal Access Token</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
        <p class="hint">Create at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> with <code>repo</code> scope</p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="save-btn" onclick="saveToken()">Save Token</button>
        <button class="btn btn-ghost" onclick="clearToken()">Remove</button>
        <span id="token-status"></span>
      </div>
    </div>
    <div class="card" id="repos-card" style="display:none">
      <h2>Your Repositories</h2>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('mine')">My Repos</button>
        <button class="tab" onclick="switchTab('orgs')">Organizations</button>
      </div>
      <div id="repos-content"><div class="loading"><div class="spinner"></div> Loading...</div></div>
    </div>
    <div class="card">
      <h2>Workspace Projects</h2>
      <p class="card-desc">Projects in your workspace.</p>
      <div id="projects-content"><div class="loading"><div class="spinner"></div> Loading...</div></div>
      <div style="margin-top:10px"><button class="btn btn-ghost" onclick="loadProjects()">Refresh</button></div>
    </div>
  </div>
  <script>
    let currentTab='mine', orgsCache=null;
    function toast(m,t='success'){const e=document.createElement('div');e.className='toast toast-'+t;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3500);}
    async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...o.headers}});return{status:r.status,data:await r.json()};}
    async function saveToken(){
      const t=document.getElementById('gh-token').value.trim();
      if(!t)return toast('Enter a token','error');
      document.getElementById('save-btn').disabled=true;
      const{status,data}=await api('/api/github/token',{method:'POST',body:JSON.stringify({token:t})});
      if(status===200){toast('Token saved');document.getElementById('gh-token').value='';await checkToken();await loadRepos();}
      else toast(data.error||'Failed','error');
      document.getElementById('save-btn').disabled=false;
    }
    async function clearToken(){await api('/api/github/token',{method:'POST',body:JSON.stringify({token:''})});toast('Token removed');document.getElementById('repos-card').style.display='none';document.getElementById('token-status').innerHTML='';}
    async function checkToken(){const{data}=await api('/api/github/token');const e=document.getElementById('token-status');if(data.hasToken){e.innerHTML='<span class="status status-ok">&#x2713; Configured</span>';document.getElementById('repos-card').style.display='block';}else{e.innerHTML='<span class="status status-err">&#x2717; No token</span>';document.getElementById('repos-card').style.display='none';}}
    function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');if(t==='mine')loadRepos();else loadOrgs();}
    async function loadRepos(){const e=document.getElementById('repos-content');e.innerHTML='<div class="loading"><div class="spinner"></div> Loading...</div>';const{s,d}=await api('/api/github/repos');if(s!==200){e.innerHTML='<div class="empty">'+d.error+'</div>';return;}e.innerHTML='<div class="repo-list">'+d.repos.map(r=>'<div class="repo-item"><div class="repo-info"><div class="repo-name">'+r.full_name+(r.private?' <span class="repo-badge">Private</span>':'')+'</div>'+(r.description?'<div class="repo-desc">'+r.description+'</div>':'')+'<div class="repo-meta">'+(r.language?'<span>'+r.language+'</span>':'')+'<span>'+new Date(r.updated_at).toLocaleDateString()+'</span></div></div></div>').join('')+'</div>';}
    async function loadOrgs(){const e=document.getElementById('repos-content');e.innerHTML='<div class="loading"><div class="spinner"></div> Loading...</div>';if(orgsCache)return renderOrgs(orgsCache);const{s,d}=await api('/api/github/orgs');if(s!==200){e.innerHTML='<div class="empty">'+d.error+'</div>';return;}orgsCache=d.orgs;renderOrgs(d.orgs);}
    function renderOrgs(o){const e=document.getElementById('repos-content');if(!o.length){e.innerHTML='<div class="empty">No orgs</div>';return;}e.innerHTML=o.map(g=>'<div class="repo-item"><div class="repo-info"><div class="repo-name">'+g.login+'</div></div></div>').join('');}
    async function loadProjects(){const e=document.getElementById('projects-content');const{d}=await api('/api/projects');if(!d.projects.length){e.innerHTML='<div class="empty">No projects yet</div>';return;}e.innerHTML=d.projects.map(p=>'<div class="project-item"><div class="project-name">'+p.name+'</div><a href="/" class="btn btn-primary" style="text-decoration:none;font-size:12px">Open</a></div>').join('');}
    checkToken().then(()=>{if(document.getElementById('repos-card').style.display!=='none')loadRepos();});loadProjects();
  </script>
</body>
</html>
